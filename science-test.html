<title>Science Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, one screen at a time (setup -> question -> result) */
:root {
  --bg: #f3f6f4;
  --surface: #ffffff;
  --fg: #14231c;
  --muted: #5b6b63;
  --line: #d5dfd9;
  --accent: #0f7b5f;
  --accent-fg: #ffffff;
  --accent-soft: #dff3ec;
  --good: #14804a;
  --good-soft: #ddf3e6;
  --bad: #b3261e;
  --bad-soft: #fbe3e0;
  --warn: #b25e00;
  --font-body: "Inter", "Noto Sans Devanagari", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a15; --surface: #16251e; --fg: #e8f1ec; --muted: #93a79c; --line: #284034;
    --accent: #3fc79f; --accent-fg: #06251b; --accent-soft: #17382d;
    --good: #5fd391; --good-soft: #163a27; --bad: #ff8a80; --bad-soft: #43201d; --warn: #f0a24a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a15; --surface: #16251e; --fg: #e8f1ec; --muted: #93a79c; --line: #284034;
  --accent: #3fc79f; --accent-fg: #06251b; --accent-soft: #17382d;
  --good: #5fd391; --good-soft: #163a27; --bad: #ff8a80; --bad-soft: #43201d; --warn: #f0a24a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 1.15rem; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
label, .lbl { font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 6px; }
input, select {
  width: 100%; min-height: 48px; padding: 10px 12px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button { min-height: 48px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; min-height: 52px; padding: 12px 18px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
}
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
button:disabled { opacity: .45; cursor: default; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); }
.timer.low { background: var(--bad-soft); color: var(--bad); }
.meta { font-size: .85rem; color: var(--muted); }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.q { font-size: 1.1rem; font-weight: 600; line-height: 1.45; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: flex-start; font-weight: 500; line-height: 1.4; }
.opt b { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); font-size: .85rem; }
.opt.sel { background: var(--accent-soft); border-color: var(--accent); }
.opt.sel b { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.score .big { font-size: 3.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 4px; }
.stats strong { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.stats span { font-size: .75rem; color: var(--muted); }
.rv { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.rv.ok { border-left: 5px solid var(--good); }
.rv.no { border-left: 5px solid var(--bad); }
.rv .ans { font-size: .92rem; padding: 6px 10px; border-radius: 8px; }
.rv .ans.g { background: var(--good-soft); }
.rv .ans.b { background: var(--bad-soft); }
.warnbox { background: var(--bad-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
/* Brand banner: orchid gradient that drifts, a light shine sweeping across, round stickers that pop in then float, wiggle or twinkle */
.brand { position: relative; overflow: hidden; border-radius: 18px; padding: 24px 54px 20px; text-align: center; color: #3b1a4d;
  background: linear-gradient(120deg, #f7d5f4, #ebc3f3, #d9b5f8, #f4bfe6, #fcd8ef, #f7d5f4); background-size: 300% 300%;
  animation: drift 12s ease-in-out infinite; }
.brand::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; pointer-events: none;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); transform: skewX(-18deg); animation: sweep 5.5s ease-in-out 1s infinite; }
.brand .name { position: relative; z-index: 1; font-size: 1.9rem; font-weight: 700; line-height: 1.15; display: flex; justify-content: center; flex-wrap: wrap; gap: 0 .35em; }
.brand .name span { display: inline-block; opacity: 0; animation: rise .7s ease-out forwards; }
.brand .name span:nth-child(1) { color: #a1209b; animation-delay: .05s; }
.brand .name span:nth-child(2) { color: #6a2fbf; animation-delay: .25s; }
.brand .name span:nth-child(3) { color: #c0176f; animation-delay: .45s; }
.brand .tag { position: relative; z-index: 1; margin-top: 6px; font-size: .8rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #5a3a70; opacity: 0; animation: rise .7s ease-out .75s forwards; }
.brand i { position: absolute; border-radius: 50%; background: rgba(255,255,255,.55); animation: floaty 6s ease-in-out infinite; }
.brand i:nth-of-type(1) { width: 60px; height: 60px; left: 30%; top: -34px; }
.brand i:nth-of-type(2) { width: 34px; height: 34px; right: 28%; bottom: -14px; animation-delay: -3s; }
.stk { position: absolute; z-index: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; line-height: 1;
  background: rgba(255,255,255,.8); box-shadow: 0 2px 6px rgba(120,40,140,.28);
  animation: pop .6s cubic-bezier(.3,1.6,.5,1) both, var(--mv) 4s ease-in-out .8s infinite; }
.stk.l { left: 9px; } .stk.r { right: 9px; }
.stk.a { top: 7%; } .stk.b { top: 38%; } .stk.c { top: 69%; }
.stk:nth-of-type(1) { --mv: floaty; animation-delay: .2s, .8s; }
.stk:nth-of-type(2) { --mv: wiggle; animation-delay: .35s, 1s; }
.stk:nth-of-type(3) { --mv: floaty; animation-delay: .5s, 1.2s; }
.stk:nth-of-type(4) { --mv: twinkle; animation-delay: .3s, .9s; }
.stk:nth-of-type(5) { --mv: floaty; animation-delay: .45s, 1.5s; }
.stk:nth-of-type(6) { --mv: wiggle; animation-delay: .6s, 1.1s; }
@keyframes drift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes wiggle { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
@keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.18) rotate(14deg); } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes sweep { 0% { left: -60%; } 55%, 100% { left: 130%; } }
@media (prefers-reduced-motion: reduce) {
  .brand, .brand i, .brand::after, .stk { animation: none; }
  .brand .name span, .brand .tag { animation: none; opacity: 1; }
}
textarea { width: 100%; padding: 10px 12px; font: inherit; font-size: .9rem; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; resize: none; }
.btn { display: grid; place-items: center; min-height: 52px; padding: 12px 18px; border-radius: 12px; text-decoration: none; font-weight: 600; text-align: center; background: var(--accent); color: var(--accent-fg); }
</style>

<div class="wrap">

  <header class="brand">
    <i></i><i></i>
    <span class="stk l a" aria-hidden="true">🌸</span>
    <span class="stk l b" aria-hidden="true">🔬</span>
    <span class="stk l c" aria-hidden="true">📚</span>
    <span class="stk r a" aria-hidden="true">⭐</span>
    <span class="stk r b" aria-hidden="true">🧪</span>
    <span class="stk r c" aria-hidden="true">🧬</span>
    <div class="name"><span>Deva</span><span>Study</span><span>Classes</span></div>
    <p class="tag">Science Practice Test</p>
  </header>

  <!-- Screen 1: setup -->
  <section id="s-setup" class="card">
    <h1 id="t-title">Science Test</h1>
    <p class="muted" id="t-intro">Test shuru karne se pehle details bharein.</p>
    <div><label for="f-name" id="l-name">Naam</label><input id="f-name" type="text" autocomplete="name" placeholder="Student ka naam"></div>
    <div>
      <label for="f-subject" id="l-subject">Subject</label>
      <select id="f-subject">
        <option value="Physics">Physics (भौतिक विज्ञान)</option>
        <option value="Chemistry">Chemistry (रसायन विज्ञान)</option>
        <option value="Biology" selected>Biology (जीव विज्ञान)</option>
        <option value="General Science">General Science (सामान्य विज्ञान)</option>
      </select>
    </div>
    <div><label for="f-chapter" id="l-chapter">Chapter ka naam ya number</label><input id="f-chapter" type="text" value="Chapter 5: जैव प्रक्रम" placeholder="Chapter 1 / प्रकाश"></div>
    <div>
      <label for="f-time" id="l-time">Test ka samay</label>
      <select id="f-time">
        <option value="10">10 min</option><option value="20">20 min</option>
        <option value="30">30 min</option><option value="40">40 min</option>
        <option value="60" selected>60 min</option><option value="0">No timer</option>
      </select>
    </div>
    <div>
      <span class="lbl" id="l-lang">Bhasha</span>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="b-hi" class="on">हिन्दी</button>
        <button type="button" id="b-en">English</button>
      </div>
    </div>
    <button type="button" id="b-start" class="primary">Test shuru karein</button>
    <p class="meta" id="t-count"></p>
  </section>

  <!-- Screen 2: quiz -->
  <section id="s-quiz" hidden class="wrap" style="gap:14px">
    <div class="top"><span class="meta" id="q-info"></span><span class="timer" id="q-timer">00:00</span></div>
    <div class="bar"><i id="q-bar"></i></div>
    <div class="card">
      <p class="meta" id="q-num"></p>
      <p class="q" id="q-text"></p>
      <div class="opts" id="q-opts"></div>
    </div>
    <div class="nav">
      <button type="button" id="b-prev">Pichhla</button>
      <button type="button" id="b-next" class="primary">Agla</button>
    </div>
    <div class="warnbox" id="q-warn" hidden>
      <p id="q-warn-text"></p>
      <div class="nav">
        <button type="button" id="b-back">Wapas</button>
        <button type="button" id="b-confirm" class="primary">Submit</button>
      </div>
    </div>
  </section>

  <!-- Screen 3: result -->
  <section id="s-result" hidden class="wrap">
    <div class="card score">
      <p class="meta" id="r-who"></p>
      <div class="big" id="r-score"></div>
      <p id="r-pct" style="font-weight:600"></p>
      <p class="meta" id="r-sub"></p>
      <div class="stats">
        <div><strong id="r-c" style="color:var(--good)">0</strong><span id="r-cl"></span></div>
        <div><strong id="r-w" style="color:var(--bad)">0</strong><span id="r-wl"></span></div>
        <div><strong id="r-s">0</strong><span id="r-sl"></span></div>
      </div>
    </div>
    <div class="card" id="r-send">
      <p id="r-send-t" style="font-weight:600"></p>
      <textarea id="r-msg" readonly rows="5" aria-label="Result"></textarea>
      <div class="nav">
        <a id="r-wa" class="btn" href="#" target="_blank" rel="noopener"></a>
        <button type="button" id="r-copy"></button>
      </div>
    </div>
    <h2 id="r-rev"></h2>
    <div class="wrap" id="r-list" style="gap:12px"></div>
    <button type="button" id="b-again" class="primary"></button>
  </section>
</div>

<script>
/* ============ QUESTIONS ============
   Har question ka format:
   { q:"question", o:["A","B","C","D"], a:1 }
   a = sahi option ka number (0 = pehla, 1 = doosra, 2 = teesra, 3 = chautha)
   English version chahiye to qe:"..." aur oe:[...] bhi jodein. Na ho to Hindi dikhegi.
*/
var QUESTIONS = [
  { q:"प्रकाश संश्लेषण क्रिया में ऑक्सीजन गैस निकलती है", o:["कार्बन डाइऑक्साइड से","जल से","वायु से","पर्ण हरित के विघटन से"], a:1 },
  { q:"प्रकाश अभिक्रिया होती है।", o:["माइटोकॉण्ड्रिया में","हरित लवक के ग्रेना में","राइबोसोम में","हरित लवक के स्ट्रोमा में"], a:3 },
  { q:"क्लोरोप्लास्ट के ग्रेना में बनते हैं", o:["ATP तथा NAD. 2H","ATP तथा ग्लूकोस","ATP तथा NADP2H","उपर्युक्त सभी"], a:2 },
  { q:"क्लोरोफिल अवशोषित करता है", o:["जल","खनिज लवण","प्रकाश ऊर्जा","ऑक्सीजन"], a:2 },
  { q:"हरितलवक के स्ट्रोमा में कौन-सी क्रिया होती है?", o:["प्रकाशीय अभिक्रिया","अप्रकाशीय अभिक्रिया","(a) और (b) दोनों अभिक्रियाएँ","उपरोक्त में से कोई नहीं"], a:1 },
  { q:"पादपों में वायु प्रदूषण कम करने वाली प्रक्रिया", o:["श्वसन","प्रकाश-संश्लेषण","वाष्पोत्सर्जन","प्रोटीन संश्लेषण"], a:1 },
  { q:"पायरुवेट के विखंडन से यह कार्बन डाइऑक्साइड, जल तथा ऊर्जा देता है और यह क्रिया होती है।", o:["कोशिकाद्रव्य में","माइटोकॉण्ड्रिया में","हरित लवक में","केन्द्रक में"], a:1 },
  { q:"स्वपोषी पोषण के लिए आवश्यक है।", o:["कार्बन डाइऑक्साइड तथा जल","क्लोरोफिल","सूर्य का प्रकाश","उपर्युक्त सभी"], a:3 },
  { q:"निम्नलिखित में से कौन विषमपोषी नहीं है?", o:["फफूँदी","फीताकृमि","यीस्ट","मनी प्लांट"], a:3 },
  { q:"आहारनाल की C के आकार की संरचना है।", o:["आमाशय","ग्रहणी","प्रसनी","कृमिरूप परिशेषिका"], a:1 },
  { q:"मनुष्य में ग्रासनली की लम्बाई होती है", o:["5.8 सेमी","25-30 सेमी","1.5 मीटर","15 फीट"], a:1 },
  { q:"मनुष्यों में लार ग्रन्थियों की संख्या होती है", o:["दो जोड़ी","तीन जोड़ी","चार जोड़ी","पाँच जोड़ी"], a:1 },
  { q:"कृमिरूप परिशेषिका .......... का भाग है।", o:["छोटी आँत","अग्न्याशय","बड़ी आँत (कोलन)","ग्रासनली"], a:2 },
  { q:"मनुष्य में दूध के दाँतों की संख्या कितनी होती है?", o:["20","24","28","32"], a:0 },
  { q:"मनुष्य के प्रत्येक जबड़े में चर्वणक दन्तों की संख्या होती है।", o:["2","4","6","8"], a:2 },
  { q:"ग्रासनली द्वार पर लटकी हुई पत्ती के समान कार्टिलेज रचना कहलाती है।", o:["एपीफैरेक्स","एपीग्लोटिस","एल्विओलाई","श्लेष्मावरण"], a:1 },
  { q:"यकृत स्रावित करता है।", o:["लार","जठररस","पित्त रस","अग्न्याशयिक रस"], a:2 },
  { q:"आहारनाल के पेशीय संकुचन को कहते हैं", o:["पाचन","क्रमाकुंचन","परिसंचरण","अवशोषण"], a:1 },
  { q:"जठर रस स्रावित होता है", o:["अग्न्याशय","छोटी आँत","आमाशय","बड़ी आँत"], a:2 },
  { q:"ट्रिप्सिन एंजाइम क्रिया करता है", o:["प्रोटीन पर","स्टार्च पर","वसा पर","लवणों पर"], a:0 },
  { q:"निम्न में से विटामिन्स का कौन-सा जोड़ा जल में घुलनशील है?", o:["विटामिन A तथा B","विटामिन B तथा C","विटामिन C तथा K","विटामिन D तथा B"], a:1 },
  { q:"विटामिन 'C' का अच्छा स्रोत है", o:["अण्डा","मछली","गेहूँ","संतरा"], a:3 },
  { q:"बेरी-बेरी रोग किस विटामिन की कमी से होता है?", o:["विटामिन B1","विटामिन B2","विटामिन B3","विटामिन B5"], a:0 },
  { q:"निम्नलिखित में से मनुष्य की लार में पाया जाता है", o:["टायलिन","लाइसोजाइम","पेप्सिन","टायलिन व लाइसोजाइम दोनों"], a:0 },
  { q:"हीमोग्लोबिन महत्त्वपूर्ण भूमिका निभाता है", o:["उत्सर्जन में","श्वसन में","पाचन में","वृद्धि में"], a:1 },
  { q:"ऊर्जा की मुद्रा है", o:["डी०एन०ए०","आर०एन०ए०","ए०टी०पी०","क्लोरोफिल"], a:2 },

/* Teacher ka WhatsApp number country code ke saath, bina + ya space ke. Example: "919876543210". Khali chhodne par student khud contact chunega. */
var TEACHER_WA = "";
var lastMsg = "";
var lang = "hi", answers = [], cur = 0, left = 0, tick = null, cfg = {};
var $ = function (id) { return document.getElementById(id); };
function qt(q) { return (lang === "en" && q.qe) ? q.qe : q.q; }
function qo(q) { return (lang === "en" && q.oe) ? q.oe : q.o; }
function show(id) { ["s-setup", "s-quiz", "s-result"].forEach(function (s) { $(s).hidden = (s !== id); }); window.scrollTo(0, 0); }

function applySetupText() {
  var t = UI[lang];
  document.documentElement.lang = lang;
  $("t-title").textContent = t.title; $("t-intro").textContent = t.intro;
  $("l-name").textContent = t.name; $("f-name").placeholder = t.namePh;
  $("l-subject").textContent = t.subject; $("l-chapter").textContent = t.chapter;
  $("l-time").textContent = t.time; $("l-lang").textContent = t.lang;
  $("b-start").textContent = t.start; $("t-count").textContent = t.count + QUESTIONS.length;
  var opts = $("f-time").options;
  for (var i = 0; i < opts.length; i++) opts[i].textContent = opts[i].value === "0" ? t.noTimer : opts[i].value + t.min;
  $("b-hi").className = lang === "hi" ? "on" : ""; $("b-en").className = lang === "en" ? "on" : "";
}
$("b-hi").onclick = function () { lang = "hi"; applySetupText(); };
$("b-en").onclick = function () { lang = "en"; applySetupText(); };

function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }

$("b-start").onclick = function () {
  cfg = { name: $("f-name").value.trim(), subject: $("f-subject").value, chapter: $("f-chapter").value.trim(), mins: parseInt($("f-time").value, 10) };
  answers = QUESTIONS.map(function () { return -1; }); cur = 0;
  $("q-info").textContent = cfg.subject + (cfg.chapter ? " · " + cfg.chapter : "");
  clearInterval(tick);
  if (cfg.mins > 0) {
    left = cfg.mins * 60; $("q-timer").hidden = false; $("q-timer").textContent = fmt(left); $("q-timer").className = "timer";
    tick = setInterval(function () {
      left--; $("q-timer").textContent = fmt(Math.max(left, 0));
      if (left <= 60) $("q-timer").className = "timer low";
      if (left <= 0) { finish(true); }
    }, 1000);
  } else { $("q-timer").hidden = true; }
  show("s-quiz"); render();
};

function render() {
  var t = UI[lang], q = QUESTIONS[cur], n = QUESTIONS.length;
  $("q-num").textContent = t.qn + (cur + 1) + t.of + n + "  ·  " + t.answered + answers.filter(function (x) { return x >= 0; }).length;
  $("q-text").textContent = qt(q);
  $("q-bar").style.width = ((cur + 1) / n * 100) + "%";
  var box = $("q-opts"); box.innerHTML = "";
  qo(q).forEach(function (txt, i) {
    var b = document.createElement("button"); b.type = "button";
    b.className = "opt" + (answers[cur] === i ? " sel" : "");
    var l = document.createElement("b"); l.textContent = "ABCD".charAt(i);
    var s = document.createElement("span"); s.textContent = txt;
    b.appendChild(l); b.appendChild(s);
    b.onclick = function () { answers[cur] = i; render(); };
    box.appendChild(b);
  });
  $("b-prev").textContent = t.prev; $("b-prev").disabled = cur === 0;
  $("b-next").textContent = cur === n - 1 ? t.submit : t.next;
  $("q-warn").hidden = true;
}
$("b-prev").onclick = function () { if (cur > 0) { cur--; render(); } };
$("b-next").onclick = function () {
  if (cur < QUESTIONS.length - 1) { cur++; render(); return; }
  var t = UI[lang], skipped = [];
  answers.forEach(function (a, i) { if (a < 0) skipped.push(i + 1); });
  $("q-warn-text").textContent = skipped.length ? t.warn + skipped.join(", ") : t.warnOk;
  $("b-back").textContent = t.back; $("b-confirm").textContent = t.yes;
  $("q-warn").hidden = false;
};
$("b-back").onclick = function () { $("q-warn").hidden = true; };
$("b-confirm").onclick = function () { finish(false); };

function finish(timeUp) {
  clearInterval(tick);
  var t = UI[lang], n = QUESTIONS.length, c = 0, w = 0, s = 0;
  answers.forEach(function (a, i) { if (a < 0) s++; else if (a === QUESTIONS[i].a) c++; else w++; });
  var pct = Math.round(c / n * 100);
  $("r-who").textContent = (cfg.name ? cfg.name + " · " : "") + cfg.subject + (cfg.chapter ? " · " + cfg.chapter : "") + (timeUp ? " · " + t.timeUp : "");
  $("r-score").textContent = c + " / " + n;
  $("r-pct").textContent = pct + "%";
  $("r-sub").textContent = pct >= 80 ? t.great : pct >= 50 ? t.good : t.low;
  $("r-c").textContent = c; $("r-w").textContent = w; $("r-s").textContent = s;
  $("r-cl").textContent = t.correct; $("r-wl").textContent = t.wrong; $("r-sl").textContent = t.skipped;
  $("r-rev").textContent = t.review; $("b-again").textContent = t.again;
  var list = $("r-list"); list.innerHTML = "";
  QUESTIONS.forEach(function (q, i) {
    var a = answers[i], ok = a === q.a;
    var d = document.createElement("div"); d.className = "rv " + (ok ? "ok" : "no");
    var h = document.createElement("p"); h.className = "q"; h.textContent = (i + 1) + ". " + qt(q);
    var y = document.createElement("p"); y.className = "ans " + (ok ? "g" : "b");
    y.textContent = t.yours + (a < 0 ? t.none : qo(q)[a]);
    d.appendChild(h); d.appendChild(y);
    if (!ok) { var r = document.createElement("p"); r.className = "ans g"; r.textContent = t.right + qo(q)[q.a]; d.appendChild(r); }
    list.appendChild(d);
  });
  lastMsg = "Deva Study Classes\n" + t.mName + ": " + (cfg.name || "-") + "\n" + t.mSub + ": " + cfg.subject + "\n" + t.mChap + ": " + (cfg.chapter || "-") + "\n" + t.mScore + ": " + c + " / " + n + " (" + pct + "%)\n" + t.correct + ": " + c + ", " + t.wrong + ": " + w + ", " + t.skipped + ": " + s;
  $("r-send-t").textContent = t.sendT; $("r-msg").value = lastMsg;
  $("r-wa").textContent = t.wa; $("r-copy").textContent = t.copy;
  $("r-wa").href = "https://wa.me/" + TEACHER_WA + "?text=" + encodeURIComponent(lastMsg);
  show("s-result");
}
$("r-copy").onclick = function () {
  var t = UI[lang], box = $("r-msg");
  function fallback() { box.focus(); box.select(); }
  try {
    navigator.clipboard.writeText(lastMsg).then(function () { $("r-copy").textContent = t.copied; }, fallback);
  } catch (e) { fallback(); }
};
$("b-again").onclick = function () { applySetupText(); show("s-setup"); };

applySetupText();
</script>
